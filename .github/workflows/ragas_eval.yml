name: Ragas RAG Evaluation & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ragas-evaluate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu -r backend/requirements.txt
        pip install pytest

    - name: Run Retriever Benchmarks (TF-IDF vs BM25)
      run: |
        python backend/benchmark_retrievers.py

    - name: Run Ragas Evaluation Suite
      run: |
        python backend/ragas_eval.py

    - name: Upload Ragas Benchmark Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ragas-benchmark-report
        path: backend/ragas_benchmark_results.json
